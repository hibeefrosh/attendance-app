<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <rect width="1500" height="980" fill="#ffffff"/>
  <defs>
    <style type="text/css"><![CDATA[
      .title { font: 700 24px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .sub { font: 600 14px Arial, Helvetica, sans-serif; fill: #6b1d2a; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 1.6; }
      .box-accent { fill: #fff7f8; stroke: #6b1d2a; stroke-width: 2; }
      .box-db { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 1.8; }
      .text { font: 700 14px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .text-small { font: 600 12px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; }
      .arrow-accent { stroke: #6b1d2a; stroke-width: 2; fill: none; }
      .legend { font: 600 12px Arial, Helvetica, sans-serif; fill: #334155; }
    ]]></style>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrowHeadAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b1d2a"/>
    </marker>
  </defs>

  <text x="50" y="42" class="sub">MOSHOOD ABIOLA POLYTECHNIC (MAPOLY)</text>
  <text x="50" y="76" class="title">APPENDIX C - System Architecture Diagram</text>
  <text x="50" y="100" class="legend">Laravel layered architecture for MAPOLY Smart Attendance</text>

  <rect x="80" y="140" width="420" height="70" rx="14" class="box-accent"/>
  <text x="290" y="170" text-anchor="middle" class="text">Client Layer</text>
  <text x="290" y="192" text-anchor="middle" class="text-small">Browser / Mobile Web (Blade + Bootstrap 5)</text>

  <rect x="80" y="250" width="420" height="70" rx="14" class="box"/>
  <text x="290" y="280" text-anchor="middle" class="text">Routing Layer</text>
  <text x="290" y="302" text-anchor="middle" class="text-small">routes/web.php</text>

  <rect x="80" y="360" width="420" height="80" rx="14" class="box"/>
  <text x="290" y="392" text-anchor="middle" class="text">Middleware + Policies</text>
  <text x="290" y="414" text-anchor="middle" class="text-small">auth, role:lecturer/student, CoursePolicy, SessionPolicy</text>

  <rect x="80" y="480" width="420" height="110" rx="14" class="box"/>
  <text x="290" y="515" text-anchor="middle" class="text">Controllers</text>
  <text x="290" y="538" text-anchor="middle" class="text-small">AuthController, CourseController,</text>
  <text x="290" y="558" text-anchor="middle" class="text-small">AttendanceSessionController, AttendanceController, ReportController</text>

  <rect x="80" y="630" width="420" height="90" rx="14" class="box"/>
  <text x="290" y="665" text-anchor="middle" class="text">Services</text>
  <text x="290" y="688" text-anchor="middle" class="text-small">AttendanceSessionService (QR), AttendanceService (scan + manual + email)</text>

  <rect x="600" y="480" width="400" height="110" rx="14" class="box"/>
  <text x="800" y="520" text-anchor="middle" class="text">Eloquent Models</text>
  <text x="800" y="545" text-anchor="middle" class="text-small">User, Role, Course, CourseRegistration,</text>
  <text x="800" y="565" text-anchor="middle" class="text-small">AttendanceSession, AttendanceRecord</text>

  <rect x="600" y="630" width="400" height="90" rx="14" class="box-db"/>
  <text x="800" y="682" text-anchor="middle" class="text">MySQL Database</text>

  <rect x="1100" y="250" width="340" height="90" rx="14" class="box-accent"/>
  <text x="1270" y="290" text-anchor="middle" class="text">QR Generation</text>
  <text x="1270" y="315" text-anchor="middle" class="text-small">Secure session token (SHA-256)</text>

  <rect x="1100" y="380" width="340" height="90" rx="14" class="box-accent"/>
  <text x="1270" y="420" text-anchor="middle" class="text">Mail (Mailable)</text>
  <text x="1270" y="445" text-anchor="middle" class="text-small">Immediate send() after successful scan</text>

  <rect x="1100" y="510" width="340" height="90" rx="14" class="box"/>
  <text x="1270" y="550" text-anchor="middle" class="text">SMTP Provider</text>
  <text x="1270" y="575" text-anchor="middle" class="text-small">No queue - sync delivery</text>

  <!-- Arrows -->
  <path d="M290,210 L290,250" class="arrow" marker-end="url(#arrowHead)"/>
  <path d="M290,320 L290,360" class="arrow" marker-end="url(#arrowHead)"/>
  <path d="M290,440 L290,480" class="arrow" marker-end="url(#arrowHead)"/>
  <path d="M290,590 L290,630" class="arrow" marker-end="url(#arrowHead)"/>
  <path d="M500,535 L600,535" class="arrow" marker-end="url(#arrowHead)"/>
  <path d="M800,590 L800,630" class="arrow" marker-end="url(#arrowHead)"/>
  <path d="M500,670 C700,670 900,295 1100,295" class="arrow-accent" marker-end="url(#arrowHeadAccent)"/>
  <path d="M500,655 C780,655 900,425 1100,425" class="arrow-accent" marker-end="url(#arrowHeadAccent)"/>
  <path d="M1270,470 L1270,510" class="arrow" marker-end="url(#arrowHead)"/>

  <text x="50" y="780" class="sub">Data tables</text>
  <text x="50" y="808" class="legend">users, roles, courses, course_registrations, attendance_sessions, attendance_records</text>
  <text x="50" y="832" class="legend">Unique constraint: (student_id, attendance_session_id) prevents duplicate attendance</text>

  <text x="50" y="880" class="sub">Institution branding</text>
  <text x="50" y="908" class="legend">MAPOLY logo is displayed on Welcome, Login, About, and Lecturer panel.</text>
  <text x="50" y="930" class="legend">Student levels: ND I, ND II, HND I, HND II</text>

  <text x="50" y="965" class="legend">Developed by: Ojebiyi Samson Oluwaferanmi · Adeniyi Gbenga Daniel · Akinwale Elijah Idowu</text>
</svg>
